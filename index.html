<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Quiz Culture G : testez vos connaissances générales avec des questions aléatoires et quatre niveaux de difficulté.">
    <meta name="robots" content="index, follow">
    <meta name="theme-color" content="#0f8a01">
    <meta property="og:title" content="Quiz Culture G">
    <meta property="og:description" content="Testez vos connaissances générales avec des questions aléatoires et quatre niveaux de difficulté.">
    <meta property="og:type" content="website">
    <title>Quiz Culture G </title>
    <script>
        if (localStorage.getItem("theme") === "dark") document.documentElement.classList.add("dark");
    </script>
    <link rel="stylesheet" href="css/styles.css">
</head>

<body>
    <header id="theme">
        <button id="theme-btn" type="button" aria-label="Changer le thème">
            <div id="theme-container">
             <svg id="sun" width="16" height="16" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" role="img"
                aria-label="Soleil">
                <!-- Rayons -->
                <g stroke="#ffffff" stroke-width="8" stroke-linecap="round">
                    <line x1="100" y1="15" x2="100" y2="38" />
                    <line x1="100" y1="162" x2="100" y2="185" />
                    <line x1="15" y1="100" x2="38" y2="100" />
                    <line x1="162" y1="100" x2="185" y2="100" />

                    <line x1="40" y1="40" x2="56" y2="56" />
                    <line x1="144" y1="144" x2="160" y2="160" />
                    <line x1="160" y1="40" x2="144" y2="56" />
                    <line x1="56" y1="144" x2="40" y2="160" />
                </g>

                <!-- Corps du soleil -->
                <circle cx="100" cy="100" r="52" fill="#ffffff" />
            </svg >
            <svg  id="moon" width="16" height="16" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" role="img"
                aria-label="Lune" hidden>
                <mask id="moon-crescent">
                    <rect width="200" height="200" fill="#ffffff" />
                    <circle cx="125" cy="75" r="72" fill="#000000" />
                </mask>
                <circle cx="92" cy="100" r="72" fill="#ffffff" mask="url(#moon-crescent)" />
            </svg>
            </div>
        </button>
    </header>
    <main id="screen">
        <div id="loading-screen" class="loading-screen" aria-live="polite" aria-busy="true">
            <div class="loading-spinner" aria-hidden="true"></div>
            <p>Chargement...</p>
        </div>
        <h1>
            Quiz Culture G
        </h1>
        <section id="container"></section>
        <div id="start-container" class="screen" hidden>
            <p>Bienvenue dans Quiz Culture G. Testez vos connaissances et apprenez de nouvelles choses grâce à notre quiz.</p>
            <div class="difficulty-row">
                <label for="difficulty-select">Difficulté</label>
                <select id="difficulty-select">
                    <option value="1">Niveau 1 / 4</option>
                    <option value="2">Niveau 2 / 4</option>
                    <option value="3">Niveau 3 / 4</option>
                    <option value="4">Niveau 4 / 4</option>
                </select>
            </div>
            <button id="start" type="button">Débuter</button>
        </div>
        <div id="question-container" class="screen" hidden>
            <div id="hp-wrapper" class="hp-wrapper" aria-live="polite" aria-label="points de vie"></div>
            <div id="progress" aria-live="polite"></div>
            <div id="progress-bar">
                <div id="content"></div>
            </div>
            <div id="question-card" aria-describedby="progress">
                <h2 id="question-content"></h2>
                <ul id="choices"></ul>
            </div>
            <div class="controls">
                <button id="prev-btn" type="button" disabled>Précédent</button>
                <button id="next-btn" type="button">Suivant</button>
            </div>
        </div>
        <div id="final-screen" class="screen" hidden>
            <h2>Résultat</h2>
            <p id="score"></p>
            <p id="hp-status"></p>
            <p id="final-message"></p>
            <button id="restart" type="button">Nouvelle partie</button>
        </div>
    </main>
    <footer id="copyright">
        &copy;2026 Quiz Culture G
    </footer>
    <script src="js/script.js"></script>
</body>

</html>
